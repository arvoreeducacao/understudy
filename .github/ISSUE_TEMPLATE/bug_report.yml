name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Security problems go through SECURITY.md, not issues.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Panel (apps/web)
        - Computer (apps/computer)
        - Host (apps/host)
        - Deployment (docker compose or infra)
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove tokens, emails and anything private before pasting.
      render: text
