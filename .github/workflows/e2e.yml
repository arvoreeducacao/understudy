name: e2e

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        run: |
          docker compose -p understudy-e2e --env-file tests/e2e/e2e.env -f docker-compose.yml -f tests/e2e/docker-compose.e2e.yml --profile build build computer web host

      - name: Run the end-to-end test
        run: E2E_SKIP_BUILD=1 tests/e2e/run.sh

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/report
            tests/e2e/results
          retention-days: 7
