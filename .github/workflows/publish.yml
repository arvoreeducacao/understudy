name: Publish images

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        package: [apps/computer, apps/host, packages/protocol, packages/runtime]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: corepack enable

      - run: pnpm install --frozen-lockfile --filter "{./${{ matrix.package }}}..."

      - working-directory: ${{ matrix.package }}
        run: |
          if ! ls src/*.test.ts >/dev/null 2>&1; then
            echo "::notice::no tests in ${{ matrix.package }}"
            exit 0
          fi
          node --experimental-strip-types --no-warnings --test src/*.test.ts

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            arch: amd64
            runner: ubuntu-latest
          - app: web
            arch: arm64
            runner: ubuntu-24.04-arm
          - app: computer
            arch: amd64
            runner: ubuntu-latest
          - app: host
            arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            UNDERSTUDY_VERSION=${{ github.sha }}
          push: true
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/understudy-${{ matrix.app }}:${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.app }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}-${{ matrix.arch }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - env:
          OWNER: ${{ github.repository_owner }}
          SHA: ${{ github.sha }}
        run: |
          for app in web computer host; do
            base="ghcr.io/${OWNER}/understudy-${app}"
            sources=""
            for arch in amd64 arm64; do
              if docker buildx imagetools inspect "${base}:${SHA}-${arch}" >/dev/null 2>&1; then
                sources="${sources} ${base}:${SHA}-${arch}"
              fi
            done
            docker buildx imagetools create -t "${base}:${SHA}" -t "${base}:main" -t "${base}:latest" ${sources}
          done

  deploy:
    needs: publish
    if: vars.DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO }}
          DEPLOY_WORKFLOW: ${{ vars.DEPLOY_WORKFLOW || 'deploy.yml' }}
          SHA: ${{ github.sha }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DEPLOY_REPO is set but the DEPLOY_DISPATCH_TOKEN secret is missing, so nothing was deployed"
            exit 0
          fi
          gh workflow run "$DEPLOY_WORKFLOW" -R "$DEPLOY_REPO" -f tag="$SHA"
          echo "::notice::asked $DEPLOY_REPO to deploy $SHA"
