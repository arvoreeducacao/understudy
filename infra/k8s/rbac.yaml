apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ${NAME_PREFIX}-deployer
  namespace: ${K8S_NAMESPACE}
  labels:
    project: ${NAME_PREFIX}
rules:
  - apiGroups: [""]
    resources: [configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, patch]
  - apiGroups: ["apps"]
    resources: [deployments]
    resourceNames: [${NAME_PREFIX}-placeholder]
    verbs: [delete]
  - apiGroups: ["apps"]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: ["networking.k8s.io"]
    resources: [ingresses]
    verbs: [get, list, watch, create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${NAME_PREFIX}-deployer
  namespace: ${K8S_NAMESPACE}
  labels:
    project: ${NAME_PREFIX}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ${NAME_PREFIX}-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: ${DEPLOY_K8S_GROUP}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${NAME_PREFIX}-deployer
  labels:
    project: ${NAME_PREFIX}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [${K8S_NAMESPACE}]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${NAME_PREFIX}-deployer
  labels:
    project: ${NAME_PREFIX}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${NAME_PREFIX}-deployer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: ${DEPLOY_K8S_GROUP}
